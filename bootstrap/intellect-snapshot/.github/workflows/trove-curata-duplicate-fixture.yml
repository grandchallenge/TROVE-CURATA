name: TROVE-CURATA duplicate fixture

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trove-curata-duplicate-fixture.yml"
      - "requirements-trove-curata-duplicate.txt"
      - "src/grand_intellect/trove_curata_duplicate_*.py"
      - "tests/test_trove_curata_duplicate_*.py"
      - "fixtures/trove_curata/TC-FIXTURE-001/**"
      - "fixtures/trove_curata/TC-FIXTURE-002/**"
      - "fixtures/trove_curata/TC-FIXTURE-003/**"
      - "fixtures/trove_curata/TC-FIXTURE-004/**"
      - "schemas/trove_curata_duplicate_fixture_report.schema.json"
  pull_request:
    paths:
      - ".github/workflows/trove-curata-duplicate-fixture.yml"
      - "requirements-trove-curata-duplicate.txt"
      - "src/grand_intellect/trove_curata_duplicate_*.py"
      - "tests/test_trove_curata_duplicate_*.py"
      - "fixtures/trove_curata/TC-FIXTURE-001/**"
      - "fixtures/trove_curata/TC-FIXTURE-002/**"
      - "fixtures/trove_curata/TC-FIXTURE-003/**"
      - "fixtures/trove_curata/TC-FIXTURE-004/**"
      - "schemas/trove_curata_duplicate_fixture_report.schema.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trove-curata-duplicate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TC001: fixtures/trove_curata/TC-FIXTURE-001/manifest.json
  TC002: fixtures/trove_curata/TC-FIXTURE-002/manifest.json
  TC003: fixtures/trove_curata/TC-FIXTURE-003/manifest.json
  TC004: fixtures/trove_curata/TC-FIXTURE-004/manifest.json
  DO_NOT_TRACK: "true"

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-trove-curata.txt
            requirements-trove-curata-pii.txt
            requirements-trove-curata-transform.txt
            requirements-trove-curata-duplicate.txt
      - name: Install locked providers
        run: >-
          python -m pip install
          -r requirements-ci.txt
          -r requirements-trove-curata.txt
          -r requirements-trove-curata-pii.txt
          -r requirements-trove-curata-transform.txt
          -r requirements-trove-curata-duplicate.txt
      - name: Install package without build isolation
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Compile fixture chain
        run: |
          python -m compileall -q             src/grand_intellect/trove_curata_fixture.py             src/grand_intellect/trove_curata_pii_*.py             src/grand_intellect/trove_curata_transform_*.py             src/grand_intellect/trove_curata_duplicate_*.py             tests/test_trove_curata_fixture.py             tests/test_trove_curata_pii_fixture.py             tests/test_trove_curata_transform_fixture.py             tests/test_trove_curata_duplicate_*.py
      - name: Run fixture-chain mutation tests
        run: |
          python -m unittest discover -s tests -p "test_trove_curata_fixture.py" -v
          python -m unittest discover -s tests -p "test_trove_curata_pii_fixture.py" -v
          python -m unittest discover -s tests -p "test_trove_curata_transform_fixture.py" -v
          python -m unittest discover -s tests -p "test_trove_curata_duplicate_*.py" -v
      - name: Replay predecessor extraction
        run: python -m grand_intellect.trove_curata_fixture --manifest "$TC001" --output /tmp/tc001.json
      - name: Replay predecessor PII observation
        run: python -m grand_intellect.trove_curata_pii_fixture --manifest "$TC002" --output /tmp/tc002.json
      - name: Replay predecessor transformation
        run: python -m grand_intellect.trove_curata_transform_fixture --manifest "$TC003" --output /tmp/tc003.json
      - name: Execute first duplicate-observation replay
        run: python -m grand_intellect.trove_curata_duplicate_fixture --manifest "$TC004" --output /tmp/tc004-first.json
      - name: Execute independent second duplicate-observation replay
        run: python -m grand_intellect.trove_curata_duplicate_fixture --manifest "$TC004" --output /tmp/tc004-second.json
      - name: Verify deterministic reports and authority boundaries
        run: |
          cmp /tmp/tc004-first.json /tmp/tc004-second.json
          python - <<'PY'
          import json
          from pathlib import Path

          for number in (1, 2, 3):
              report = json.loads(Path(f"/tmp/tc00{number}.json").read_text(encoding="utf-8"))
              assert report["passed"] is True
              assert all(value is False for value in report["claims"].values())

          report = json.loads(Path("/tmp/tc004-first.json").read_text(encoding="utf-8"))
          assert report["fixture_id"] == "TC-FIXTURE-004"
          assert report["record_count"] == 29
          assert report["pair_count"] == 16
          assert report["passed"] is True
          assert all(value is False for value in report["claims"].values())
          assert all(record["source_record_mutated"] is False for record in report["records"])
          assert all(record["deletion_state"] == "not_deleted" for record in report["records"])
          assert all(record["canonical_member"] is None for record in report["records"])
          assert all(pair["provider_observation"]["may_authorize_edge"] is False for pair in report["pairs"])
          assert all(pair["provider_observation"]["may_authorize_route"] is False for pair in report["pairs"])
          assert all(pair["routing_record"]["admission_state"] == "not_admitted" for pair in report["pairs"])
          assert all(component["canonical_member"] is None for component in report["components"])
          transitive = next(component for component in report["components"] if component["members"] == ["trans-a", "trans-b", "trans-c"])
          assert len(transitive["admitted_observation_ids"]) == 2
          PY
