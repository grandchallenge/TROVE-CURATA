name: TROVE-CURATA PII fixture

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trove-curata-pii-fixture.yml"
      - "fixtures/trove_curata/TC-FIXTURE-002/**"
      - "requirements-trove-curata-pii.txt"
      - "schemas/trove_curata_pii_fixture_report.schema.json"
      - "src/grand_intellect/trove_curata_pii_*.py"
      - "tests/test_trove_curata_pii_fixture.py"
  pull_request:
    paths:
      - ".github/workflows/trove-curata-pii-fixture.yml"
      - "fixtures/trove_curata/TC-FIXTURE-002/**"
      - "requirements-trove-curata-pii.txt"
      - "schemas/trove_curata_pii_fixture_report.schema.json"
      - "src/grand_intellect/trove_curata_pii_*.py"
      - "tests/test_trove_curata_pii_fixture.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trove-curata-pii-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FIXTURE_MANIFEST: fixtures/trove_curata/TC-FIXTURE-002/manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-trove-curata-pii.txt
      - name: Install locked provider
        run: python -m pip install -r requirements-ci.txt -r requirements-trove-curata-pii.txt
      - name: Install package without build isolation
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Compile fixture
        run: python -m compileall -q src/grand_intellect/trove_curata_pii_*.py tests/test_trove_curata_pii_fixture.py
      - name: Run dependency-light mutation tests
        run: python -m unittest discover -s tests -p "test_trove_curata_pii_fixture.py" -v
      - name: Execute first provider replay
        run: python -m grand_intellect.trove_curata_pii_fixture --manifest "$FIXTURE_MANIFEST" --output /tmp/tc-fixture-002-first.json
      - name: Execute independent second provider replay
        run: python -m grand_intellect.trove_curata_pii_fixture --manifest "$FIXTURE_MANIFEST" --output /tmp/tc-fixture-002-second.json
      - name: Verify deterministic report and authority boundary
        run: |
          cmp /tmp/tc-fixture-002-first.json /tmp/tc-fixture-002-second.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/tc-fixture-002-first.json").read_text(encoding="utf-8"))
          assert report["passed"] is True
          assert report["case_count"] == 11
          assert all(value is False for value in report["claims"].values())
          assert all(case["analysis_receipt"]["provider_may_authorize_route"] is False for case in report["cases"])
          assert all(case["routing_record"]["admission_state"] == "not_admitted" for case in report["cases"])
          assert all(case["routing_record"]["redaction_state"] == "not_performed" for case in report["cases"])
          assert report["duplicate_checks"][0]["observation_digest_equal"] is True
          PY
