name: TROVE-CURATA fixture

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trove-curata-fixture.yml"
      - "requirements-trove-curata.txt"
      - "src/grand_intellect/trove_curata_fixture.py"
      - "tests/test_trove_curata_fixture.py"
      - "fixtures/trove_curata/**"
      - "schemas/trove_curata_fixture_report.schema.json"
  pull_request:
    paths:
      - ".github/workflows/trove-curata-fixture.yml"
      - "requirements-trove-curata.txt"
      - "src/grand_intellect/trove_curata_fixture.py"
      - "tests/test_trove_curata_fixture.py"
      - "fixtures/trove_curata/**"
      - "schemas/trove_curata_fixture_report.schema.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trove-curata-fixture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: "true"
  FIXTURE_MANIFEST: fixtures/trove_curata/TC-FIXTURE-001/manifest.json

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-trove-curata.txt
      - name: Install locked providers
        run: python -m pip install -r requirements-ci.txt -r requirements-trove-curata.txt
      - name: Install package without build isolation
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Compile fixture
        run: python -m compileall -q src/grand_intellect/trove_curata_fixture.py tests/test_trove_curata_fixture.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_trove_curata_fixture.py" -v
      - name: Execute first replay
        run: python -m grand_intellect.trove_curata_fixture --manifest "$FIXTURE_MANIFEST" --output /tmp/tc-fixture-first.json
      - name: Print bounded extraction diagnostics
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          from grand_intellect.trove_curata_fixture import extract_with_daft, load_manifest
          manifest_path = Path("fixtures/trove_curata/TC-FIXTURE-001/manifest.json")
          manifest = load_manifest(manifest_path)
          rows = [
              {"case_id": case["case_id"], "html": (manifest_path.parent / case["path"]).read_text(encoding="utf-8")}
              for case in manifest["cases"]
          ]
          for row in sorted(extract_with_daft(rows), key=lambda item: item["case_id"]):
              print(f"--- {row['case_id']} ---")
              print(row["extracted_text"])
          PY
      - name: Execute independent second replay
        run: python -m grand_intellect.trove_curata_fixture --manifest "$FIXTURE_MANIFEST" --output /tmp/tc-fixture-second.json
      - name: Verify deterministic report and claim boundary
        run: |
          cmp /tmp/tc-fixture-first.json /tmp/tc-fixture-second.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/tc-fixture-first.json").read_text(encoding="utf-8"))
          assert report["fixture_id"] == "TC-FIXTURE-001"
          assert report["case_count"] == 9
          assert report["passed"] is True
          assert report["configuration"]["network_required_for_replay"] is False
          assert all(value is False for value in report["claims"].values())
          assert all(item["normalized_digest_equal"] is True for item in report["duplicate_checks"])
          PY
